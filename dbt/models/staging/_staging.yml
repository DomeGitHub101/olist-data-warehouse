version: 2

models:
  - name: stg_orders
    description: One row per order, with typed timestamps.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [created, approved, invoiced, processing, shipped, delivered, canceled, unavailable]
      - name: purchased_at
        data_tests: [not_null]

  - name: stg_order_items
    description: One row per item within an order.
    data_tests:
      - unique:
          arguments:
            column_name: "order_id || '-' || order_item_id"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id
      - name: price
        data_tests: [not_null, non_negative]
      - name: freight_value
        data_tests: [not_null, non_negative]

  - name: stg_customers
    description: One row per order-level customer_id.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]

  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_category_translation
    columns:
      - name: category_name
        data_tests: [unique, not_null]

  - name: stg_order_payments
    description: One row per payment; an order can be paid in several parts.
    data_tests:
      - unique:
          arguments:
            column_name: "order_id || '-' || payment_sequential"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card, not_defined]
      - name: payment_value
        data_tests: [not_null, non_negative]

  - name: stg_order_reviews
    description: One row per review and order pair.
    data_tests:
      - unique:
          arguments:
            column_name: "review_id || '-' || order_id"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: review_score
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_geolocation
    description: One row per zip code prefix with averaged coordinates.
    columns:
      - name: zip_code_prefix
        data_tests: [unique, not_null]
